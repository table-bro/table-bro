<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table, Bro Architecture</title>
<style>
  /* Layout: a wide schematic map is the centerpiece, the reading sections sit in a 1180px column, zones are tinted by package */
  :root {
    --bg: #f4f5f8;
    --surface: #ffffff;
    --ink: #1c2030;
    --muted: #5e6578;
    --line: #8f96aa;
    --rule: #dde0e8;
    --accent: #d1366b;
    --accent-soft: #fbe4ec;
    --on-accent: #ffffff;
    --z-app: #eceef2;
    --z-app-b: #b3b8c4;
    --z-app-t: #4f5666;
    --z-wrap: #f1ebfb;
    --z-wrap-b: #b9a3e6;
    --z-wrap-t: #6a45b5;
    --z-core: #e8effc;
    --z-core-b: #9db6ea;
    --z-core-t: #2c58b8;
    --z-skin: #fcefe3;
    --z-skin-b: #e8ad78;
    --z-skin-t: #9c5216;
    --z-mod: #e3f5ee;
    --z-mod-b: #8cccb2;
    --z-mod-t: #1d7a58;
    --k-state: #b98222;
    --k-view: #19849b;
    --z-host: #e8effc;
    --z-host-b: #9db6ea;
    --z-host-t: #2c58b8;
    --z-ctrl: #e9ecfd;
    --z-ctrl-b: #8f9be8;
    --z-ctrl-t: #3a46b0;
    --z-model: #fcf4e2;
    --z-model-b: #dcb466;
    --z-model-t: #8a5d0c;
    --z-view: #e2f4f7;
    --z-view-b: #7cc4d3;
    --z-view-t: #0f6a7d;
    --z-svc: #eef0f4;
    --z-svc-b: #bcc2cf;
    --z-svc-t: #555d6e;
    --danger: #c62f2f;
    --danger-soft: #fde8e8;
    --font-display: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #13151c;
      --surface: #1c1f29;
      --ink: #e8eaf1;
      --muted: #9ca3b6;
      --line: #6d7489;
      --rule: #2e3240;
      --accent: #ff6f9c;
      --accent-soft: #3a1c29;
      --on-accent: #1a0f15;
      --z-app: #1d2027;
      --z-app-b: #464b58;
      --z-app-t: #aab0bd;
      --z-wrap: #221c33;
      --z-wrap-b: #5a4692;
      --z-wrap-t: #c2a8f6;
      --z-core: #172238;
      --z-core-b: #3b5591;
      --z-core-t: #93b4ff;
      --z-skin: #2a1f15;
      --z-skin-b: #87562c;
      --z-skin-t: #f2ad6f;
      --z-mod: #14291f;
      --z-mod-b: #2d6b52;
      --z-mod-t: #7fd6b2;
      --k-state: #e2b462;
      --k-view: #64cbe0;
      --z-host: #172238;
      --z-host-b: #3b5591;
      --z-host-t: #93b4ff;
      --z-ctrl: #1b1f3a;
      --z-ctrl-b: #4650a0;
      --z-ctrl-t: #a6aef8;
      --z-model: #2a2312;
      --z-model-b: #7d6024;
      --z-model-t: #e8c06e;
      --z-view: #102a30;
      --z-view-b: #2b6b78;
      --z-view-t: #6fd0e2;
      --z-svc: #1c1f27;
      --z-svc-b: #424857;
      --z-svc-t: #a5acba;
      --danger: #ff7b7b;
      --danger-soft: #3a1717;
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --bg: #13151c;
    --surface: #1c1f29;
    --ink: #e8eaf1;
    --muted: #9ca3b6;
    --line: #6d7489;
    --rule: #2e3240;
    --accent: #ff6f9c;
    --accent-soft: #3a1c29;
    --on-accent: #1a0f15;
    --z-app: #1d2027;
    --z-app-b: #464b58;
    --z-app-t: #aab0bd;
    --z-wrap: #221c33;
    --z-wrap-b: #5a4692;
    --z-wrap-t: #c2a8f6;
    --z-core: #172238;
    --z-core-b: #3b5591;
    --z-core-t: #93b4ff;
    --z-skin: #2a1f15;
    --z-skin-b: #87562c;
    --z-skin-t: #f2ad6f;
    --z-mod: #14291f;
    --z-mod-b: #2d6b52;
    --z-mod-t: #7fd6b2;
    --k-state: #e2b462;
    --k-view: #64cbe0;
    --z-host: #172238;
    --z-host-b: #3b5591;
    --z-host-t: #93b4ff;
    --z-ctrl: #1b1f3a;
    --z-ctrl-b: #4650a0;
    --z-ctrl-t: #a6aef8;
    --z-model: #2a2312;
    --z-model-b: #7d6024;
    --z-model-t: #e8c06e;
    --z-view: #102a30;
    --z-view-b: #2b6b78;
    --z-view-t: #6fd0e2;
    --z-svc: #1c1f27;
    --z-svc-b: #424857;
    --z-svc-t: #a5acba;
    --danger: #ff7b7b;
    --danger-soft: #3a1717;
    color-scheme: dark;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 400 15px/1.55 var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  code {
    font-family: var(--font-mono);
    font-size: .86em;
    padding: .08em .32em;
    border-radius: 4px;
    background: var(--bg);
    border: 1px solid var(--rule);
    overflow-wrap: anywhere;
  }

  h1, h2, h3, h4 {
    margin: 0;
    text-wrap: balance;
  }

  button {
    font: inherit;
    color: inherit;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .wrap {
    max-width: 1180px;
    margin-inline: auto;
    padding-inline: clamp(16px, 4vw, 40px);
  }

  .wide {
    max-width: 1560px;
    margin-inline: auto;
    padding-inline: clamp(16px, 3vw, 32px);
  }

  /* hero */
  .hero {
    padding-block: 28px 36px;
    display: grid;
    gap: 20px;
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .mark {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font: 600 15px var(--font-display);
  }

  .mark svg {
    width: 24px;
    height: 24px;
  }

  .toggles {
    display: inline-flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .seg {
    display: inline-flex;
    border: 1px solid var(--rule);
    border-radius: 999px;
    padding: 3px;
    background: var(--surface);
  }

  .seg button {
    border: 0;
    background: none;
    padding: 5px 12px;
    border-radius: 999px;
    font: 600 12px var(--font-body);
    letter-spacing: .06em;
    cursor: pointer;
    color: var(--muted);
  }

  .seg button[aria-pressed="true"] {
    background: var(--ink);
    color: var(--bg);
  }

  .eyebrow {
    margin: 14px 0 0;
    font: 500 12.5px var(--font-mono);
    color: var(--accent);
    letter-spacing: .04em;
  }

  .hero h1 {
    font: 700 clamp(30px, 5vw, 56px)/1.08 var(--font-display);
    letter-spacing: -.015em;
    max-width: 18ch;
  }

  .lede {
    margin: 0;
    max-width: 70ch;
    font-size: clamp(16px, 1.6vw, 18px);
    line-height: 1.6;
  }

  .facts {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    margin: 8px 0 0;
    border-top: 1px solid var(--rule);
  }

  .fact {
    padding: 16px 18px 4px 0;
    display: grid;
    gap: 4px;
    align-content: start;
    min-width: 0;
  }

  .fact + .fact {
    padding-left: 18px;
    border-left: 1px solid var(--rule);
  }

  .fv {
    font: 700 clamp(22px, 2.4vw, 30px)/1.1 var(--font-display);
    font-variant-numeric: tabular-nums;
  }

  .fl {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.4;
  }

  @media (max-width: 860px) {
    .facts {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .fact, .fact + .fact {
      padding: 14px 12px 6px 0;
      border-left: 0;
      border-bottom: 1px solid var(--rule);
    }
  }

  /* sections */
  .sec {
    padding-block: 40px;
  }

  .sec-head {
    display: grid;
    gap: 8px;
    margin-bottom: 22px;
    max-width: 76ch;
  }

  .sec-head h2 {
    font: 700 clamp(22px, 2.6vw, 30px)/1.15 var(--font-display);
    letter-spacing: -.01em;
  }

  .sec-head p {
    margin: 0;
    color: var(--muted);
  }

  /* map */
  .map-sec {
    padding-block: 8px 32px;
  }

  .map-top {
    display: flex;
    flex-wrap: wrap;
    align-items: end;
    justify-content: space-between;
    gap: 14px 24px;
    margin-bottom: 14px;
  }

  .map-top .sec-head {
    margin: 0;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    max-width: 760px;
    justify-content: flex-end;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    border: 1px solid var(--rule);
    background: var(--surface);
    border-radius: 999px;
    padding: 6px 13px 6px 7px;
    font: 500 13px var(--font-body);
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }

  .chip.all {
    padding-left: 13px;
  }

  .chip:hover {
    border-color: var(--accent);
  }

  .chip .cn {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font: 700 10.5px var(--font-display);
    border: 1px solid var(--accent);
    color: var(--accent);
  }

  .chip[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
  }

  .chip[aria-pressed="true"] .cn {
    border-color: var(--on-accent);
    color: var(--on-accent);
  }

  figure.map {
    margin: 0;
  }

  .map-scroll {
    overflow-x: auto;
    overflow-y: hidden;
    border-radius: 12px;
    -webkit-overflow-scrolling: touch;
  }

  .map-svg {
    display: block;
    width: 100%;
    height: auto;
    min-width: 1100px;
  }

  .map-foot {
    display: grid;
    grid-template-columns: minmax(0, 300px) minmax(0, 1fr);
    gap: 20px 36px;
    margin-top: 16px;
    align-items: start;
  }

  @media (max-width: 860px) {
    .map-foot {
      grid-template-columns: minmax(0, 1fr);
    }
  }

  .legend {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 7px;
    font-size: 13px;
    color: var(--muted);
  }

  .legend li {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .legend .sw {
    width: 22px;
    height: 14px;
    border-radius: 4px;
    border: 1px solid var(--zb);
    background: var(--zfill);
    flex: none;
  }

  .legend .sw.kind {
    background: var(--surface);
    border-width: 2px;
  }

  .legend svg {
    width: 30px;
    height: 14px;
    flex: none;
    overflow: visible;
  }

  .legend .bd {
    flex: none;
    min-width: 22px;
    height: 16px;
    border-radius: 8px;
    background: var(--accent);
    color: var(--on-accent);
    font: 700 10px/16px var(--font-body);
    text-align: center;
    padding-inline: 5px;
  }

  .panel {
    min-height: 120px;
  }

  .panel .hint {
    margin: 0;
    color: var(--muted);
    max-width: 66ch;
  }

  .panel .cap {
    margin-top: 8px;
    font-size: 13.5px;
    color: var(--muted);
    max-width: 72ch;
  }

  .panel-head {
    display: grid;
    gap: 2px;
    margin-bottom: 10px;
  }

  .panel-head b {
    font-weight: 600;
    font-size: 16px;
  }

  .psteps {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 6px 28px;
    counter-reset: s;
  }

  @media (max-width: 860px) {
    .psteps {
      grid-template-columns: minmax(0, 1fr);
    }
  }

  .psteps li {
    display: grid;
    grid-template-columns: 20px minmax(0, 1fr);
    gap: 8px;
    font-size: 13.5px;
    line-height: 1.45;
  }

  .psteps li::before {
    counter-increment: s;
    content: counter(s);
    height: 18px;
    min-width: 18px;
    border-radius: 9px;
    background: var(--accent);
    color: var(--on-accent);
    font: 700 10px/18px var(--font-body);
    text-align: center;
  }

  /* svg */
  .zone rect {
    fill: var(--zfill);
    stroke: var(--zb);
    stroke-width: 1;
  }

  .zone text {
    fill: var(--zt);
    font: 700 10.5px var(--font-body);
    letter-spacing: .07em;
  }

  .z-app {
    --zfill: var(--z-app);
    --zb: var(--z-app-b);
    --zt: var(--z-app-t);
  }

  .z-wrap {
    --zfill: var(--z-wrap);
    --zb: var(--z-wrap-b);
    --zt: var(--z-wrap-t);
  }

  .z-core {
    --zfill: var(--z-core);
    --zb: var(--z-core-b);
    --zt: var(--z-core-t);
  }

  .z-skin {
    --zfill: var(--z-skin);
    --zb: var(--z-skin-b);
    --zt: var(--z-skin-t);
  }

  .z-mod {
    --zfill: var(--z-mod);
    --zb: var(--z-mod-b);
    --zt: var(--z-mod-t);
  }

  .z-host {
    --zfill: var(--z-host);
    --zb: var(--z-host-b);
    --zt: var(--z-host-t);
  }

  .z-ctrl {
    --zfill: var(--z-ctrl);
    --zb: var(--z-ctrl-b);
    --zt: var(--z-ctrl-t);
  }

  .z-model {
    --zfill: var(--z-model);
    --zb: var(--z-model-b);
    --zt: var(--z-model-t);
  }

  .z-view {
    --zfill: var(--z-view);
    --zb: var(--z-view-b);
    --zt: var(--z-view-t);
  }

  .z-svc {
    --zfill: var(--z-svc);
    --zb: var(--z-svc-b);
    --zt: var(--z-svc-t);
  }

  .zone.big text {
    font: 800 13px var(--font-display);
    letter-spacing: .08em;
  }

  .lane-note {
    font: 400 11.5px var(--font-body);
    fill: var(--muted);
  }

  .fb {
    display: none;
  }

  .map-svg.forbidding .fb {
    display: inline;
  }

  .map-svg.forbidding .edge, .map-svg.forbidding .lbl {
    opacity: .25;
  }

  .fb-line {
    fill: none;
    stroke: var(--danger);
    stroke-width: 1.8;
    stroke-dasharray: 3 4;
    marker-end: url(#ah-fb);
  }

  .ah-fb {
    fill: var(--danger);
  }

  .fb-lbl rect, .fb-mark rect {
    fill: var(--danger-soft);
    stroke: var(--danger);
    stroke-width: 1;
  }

  .fb-lbl text, .fb-mark text {
    font: 600 10.5px var(--font-mono);
    fill: var(--danger);
  }

  .tabs {
    justify-self: start;
    margin-bottom: 6px;
  }

  .tabs button {
    font-size: 13px;
    letter-spacing: .02em;
    padding: 6px 14px;
  }

  .chips-col {
    display: grid;
    gap: 8px;
    justify-items: end;
  }

  .chip.fb-btn {
    padding-left: 13px;
    border-color: var(--danger);
    color: var(--danger);
  }

  .chip.fb-btn[aria-pressed="true"] {
    background: var(--danger);
    border-color: var(--danger);
    color: var(--surface);
  }

  .chip.fb-btn[hidden] {
    display: none;
  }

  .legend .sw.dash {
    border-style: dashed;
  }

  .fb-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 6px;
    font-size: 13.5px;
  }

  .fb-list li {
    display: grid;
    grid-template-columns: 26px minmax(0, 1fr);
    gap: 8px;
  }

  .fb-list .rn {
    width: 22px;
    height: 22px;
    font-size: 10px;
    border-color: var(--danger);
    color: var(--danger);
  }

  /* why */
  .why-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 14px;
  }

  .why-card {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 18px 20px;
    display: grid;
    gap: 8px;
    align-content: start;
    min-width: 0;
  }

  .why-card .wm {
    justify-self: start;
    font: 700 11px var(--font-mono);
    letter-spacing: .04em;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 2px 7px;
  }

  .why-card h3 {
    font: 600 16.5px/1.3 var(--font-body);
  }

  .why-card p {
    margin: 0;
    font-size: 14px;
    line-height: 1.55;
  }

  .why-card .wr {
    font-size: 12.5px;
    color: var(--muted);
    padding-top: 8px;
    border-top: 1px dashed var(--rule);
  }

  .why-card .wr b {
    color: var(--ink);
    font-weight: 600;
  }

  .sub-h {
    font: 600 18px var(--font-body);
    margin: 32px 0 12px;
  }

  .cmp-wrap {
    overflow-x: auto;
  }

  .cmp {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 12px;
    overflow: hidden;
  }

  .cmp th, .cmp td {
    text-align: left;
    vertical-align: top;
    padding: 9px 12px;
    border-bottom: 1px solid var(--rule);
  }

  .cmp th {
    font-weight: 600;
    background: var(--bg);
  }

  .cmp tr:last-child td {
    border-bottom: 0;
  }

  .cmp td:last-child {
    font-weight: 500;
  }

  .k-state {
    --zb: var(--k-state);
  }

  .k-view {
    --zb: var(--k-view);
  }

  .node .n-box {
    fill: var(--surface);
    stroke: var(--zb, var(--line));
    stroke-width: 1.2;
  }

  .node .n-t {
    font: 600 12.5px var(--font-mono);
    fill: var(--ink);
  }

  .node .n-s {
    font: 400 11px var(--font-body);
    fill: var(--muted);
  }

  .node .n-c {
    font: 700 10px var(--font-body);
    letter-spacing: .07em;
    fill: var(--zt);
  }

  .node.container .n-box {
    fill: var(--zfill);
    stroke-width: 1.6;
  }

  .node.container .n-t {
    font-size: 13px;
  }

  .node.actor .n-box {
    fill: var(--ink);
    stroke: none;
  }

  .node.actor .n-t {
    fill: var(--bg);
    font-family: var(--font-body);
    font-size: 13.5px;
  }

  .edge path {
    fill: none;
  }

  .edge .e-line {
    stroke: var(--line);
    stroke-width: 1.4;
    marker-end: url(#ah);
  }

  .edge.dashed .e-line {
    stroke-dasharray: 5 4;
  }

  .edge .e-run {
    stroke: none;
  }

  .ah {
    fill: var(--line);
  }

  .ah-on {
    fill: var(--accent);
  }

  .ah-hl {
    fill: var(--ink);
  }

  .lbl rect {
    fill: var(--surface);
    stroke: var(--rule);
    stroke-width: 1;
  }

  .lbl text {
    font: 500 10.5px var(--font-mono);
    fill: var(--muted);
  }

  .map-svg .edge, .map-svg .node, .map-svg .lbl {
    transition: opacity .25s ease;
  }

  .map-svg.flowing .edge:not(.on), .map-svg.hovering .edge:not(.hl) {
    opacity: .1;
  }

  .map-svg.flowing .node:not(.on):not(.holder), .map-svg.hovering .node:not(.hl):not(.holder) {
    opacity: .3;
  }

  .map-svg.flowing .lbl:not(.on), .map-svg.hovering .lbl:not(.hl) {
    opacity: .1;
  }

  .edge.on .e-line {
    stroke: var(--accent);
    stroke-width: 2.3;
    marker-end: url(#ah-on);
  }

  .edge.on .e-run {
    stroke: var(--surface);
    stroke-width: 1.1;
    stroke-dasharray: 1 15;
    stroke-linecap: round;
    animation: run 1.2s linear infinite;
    opacity: .9;
  }

  .edge.hl .e-line {
    stroke: var(--ink);
    stroke-width: 1.8;
    marker-end: url(#ah-hl);
  }

  .node.on .n-box {
    stroke: var(--accent);
    stroke-width: 2;
  }

  .node.actor.on .n-box {
    fill: var(--accent);
  }

  .node.actor.on .n-t {
    fill: var(--on-accent);
  }

  .node.hl .n-box {
    stroke-width: 2;
  }

  .lbl.on rect {
    stroke: var(--accent);
  }

  .lbl.on text {
    fill: var(--accent);
  }

  .badge rect {
    fill: var(--accent);
    stroke: var(--bg);
    stroke-width: 2;
  }

  .badge text {
    font: 700 10.5px var(--font-body);
    fill: var(--on-accent);
  }

  @keyframes run {
    to {
      stroke-dashoffset: -32;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .edge.on .e-run {
      animation: none;
    }

    .map-svg .edge, .map-svg .node, .map-svg .lbl {
      transition: none;
    }
  }

  /* flows */
  .flows-cols {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 28px;
  }

  @media (max-width: 900px) {
    .flows-cols {
      grid-template-columns: minmax(0, 1fr);
    }
  }

  .col {
    display: grid;
    gap: 16px;
    align-content: start;
    min-width: 0;
  }

  .col-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--rule);
  }

  .col-head h3 {
    font: 600 15px var(--font-body);
    letter-spacing: .02em;
  }

  .col-head span {
    font-size: 13px;
    color: var(--muted);
  }

  .flow-card {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 20px 22px;
    display: grid;
    gap: 14px;
    min-width: 0;
    scroll-margin-top: 16px;
  }

  .fc-head {
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }

  .ring {
    flex: none;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1.5px solid var(--accent);
    color: var(--accent);
    display: grid;
    place-items: center;
    font: 700 14px var(--font-display);
  }

  .fc-head h4 {
    font: 600 18px/1.25 var(--font-body);
    margin-top: 1px;
  }

  .trig {
    font: 400 12px/1.45 var(--font-mono);
    color: var(--muted);
  }

  .steps {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 10px;
    counter-reset: s;
  }

  .steps li {
    display: grid;
    grid-template-columns: 22px minmax(0, 1fr);
    gap: 6px 8px;
  }

  .steps li::before {
    counter-increment: s;
    content: counter(s);
    font: 600 12px/1.7 var(--font-mono);
    color: var(--accent);
  }

  .steps p {
    margin: 0;
    font-size: 14.5px;
    line-height: 1.5;
  }

  .nchip {
    grid-column: 2;
    justify-self: start;
    display: inline-flex;
    align-items: center;
    font: 500 11px/1 var(--font-mono);
    padding: 4px 7px;
    border-radius: 6px;
    border: 1px solid var(--zb);
    background: var(--zfill);
    color: var(--zt);
  }

  .note {
    font-size: 13.5px;
    color: var(--muted);
    margin: 0;
    padding-top: 12px;
    border-top: 1px dashed var(--rule);
  }

  .show-btn {
    justify-self: start;
    border: 0;
    background: none;
    padding: 2px 0;
    font: 500 13px var(--font-body);
    color: var(--accent);
    cursor: pointer;
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
  }

  /* update phases */
  .phases {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 0;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
  }

  @media (max-width: 960px) {
    .phases {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  @media (max-width: 520px) {
    .phases {
      grid-template-columns: minmax(0, 1fr);
    }
  }

  .ph {
    padding: 16px 14px 18px;
    display: grid;
    gap: 6px;
    align-content: start;
    min-width: 0;
    border-left: 1px solid var(--rule);
    cursor: pointer;
    background: none;
    border-top: 0;
    border-right: 0;
    border-bottom: 0;
    text-align: left;
  }

  .ph:first-child {
    border-left: 0;
  }

  .ph:hover, .ph[aria-pressed="true"] {
    background: var(--surface);
  }

  .ph .pn {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1.5px solid var(--pc);
    color: var(--pc);
    display: grid;
    place-items: center;
    font: 700 11.5px var(--font-display);
  }

  .ph[aria-pressed="true"] .pn {
    background: var(--pc);
    color: var(--surface);
  }

  .ph b {
    font: 600 15px var(--font-body);
  }

  .ph span {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.45;
  }

  .ph.input {
    --pc: var(--z-app-t);
  }

  .ph.state {
    --pc: var(--k-state);
  }

  .ph.frame {
    --pc: var(--k-view);
  }

  .ph.events {
    --pc: var(--accent);
  }

  .ph-detail {
    margin-top: 14px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 18px 22px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 14px 32px;
  }

  @media (max-width: 860px) {
    .ph-detail {
      grid-template-columns: minmax(0, 1fr);
    }
  }

  .ph-detail h3 {
    font: 600 17px var(--font-body);
    margin-bottom: 6px;
  }

  .ph-detail p {
    margin: 0 0 8px;
    font-size: 14.5px;
  }

  .kv {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: 6px 12px;
    margin: 0;
    font-size: 13.5px;
    align-content: start;
  }

  .kv dt {
    font: 700 10px/1.95 var(--font-body);
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
  }

  .kv dd {
    margin: 0;
    min-width: 0;
  }

  /* rules */
  .rules {
    list-style: none;
    margin: 0;
    padding: 0;
    border-top: 1px solid var(--rule);
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    column-gap: 40px;
  }

  @media (max-width: 860px) {
    .rules {
      grid-template-columns: minmax(0, 1fr);
    }
  }

  .rules li {
    display: grid;
    grid-template-columns: 32px minmax(0, 1fr);
    gap: 4px 14px;
    padding: 14px 0;
    border-bottom: 1px solid var(--rule);
    align-items: start;
  }

  .rn {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1.5px solid var(--accent);
    color: var(--accent);
    display: grid;
    place-items: center;
    font: 700 11.5px var(--font-display);
  }

  .rules b {
    display: block;
    font-weight: 600;
    font-size: 15px;
  }

  .rules p {
    margin: 2px 0 0;
    font-size: 14px;
    color: var(--muted);
  }

  /* DOM tree */
  .tgrid {
    display: grid;
    grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
    gap: 20px 36px;
    align-items: start;
  }

  @media (max-width: 900px) {
    .tgrid {
      grid-template-columns: minmax(0, 1fr);
    }
  }

  .tree {
    list-style: none;
    margin: 0;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 14px;
    min-width: 0;
  }

  .tree li {
    position: relative;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 3px 9px;
    padding: 4px 0 4px calc(var(--d) * 22px);
    min-width: 0;
  }

  .tree li.sub::before {
    content: "";
    position: absolute;
    left: calc(var(--d) * 22px - 14px);
    top: 0;
    height: 14px;
    width: 9px;
    border-left: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    border-bottom-left-radius: 4px;
  }

  .tree .sn {
    font: 500 12.5px var(--font-mono);
    overflow-wrap: anywhere;
  }

  .tree .tnote {
    font-size: 12.5px;
    line-height: 1.45;
    color: var(--muted);
  }

  .kind {
    font: 700 9.5px/1 var(--font-body);
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 3px 6px;
    border-radius: 5px;
    border: 1px solid var(--rule);
    color: var(--muted);
    white-space: nowrap;
  }

  .kind.view {
    border-color: var(--k-view);
    color: var(--k-view);
  }

  .kind.skin {
    border-color: var(--z-skin-b);
    background: var(--z-skin);
    color: var(--z-skin-t);
  }

  .kind.layout {
    border-color: var(--z-mod-b);
    background: var(--z-mod);
    color: var(--z-mod-t);
  }

  .tside {
    display: grid;
    gap: 18px;
    min-width: 0;
  }

  .tside h4 {
    font: 600 14.5px var(--font-body);
    margin-bottom: 6px;
  }

  .tside p {
    margin: 0;
    font-size: 14px;
    line-height: 1.55;
    color: var(--muted);
  }

  /* blocks */
  .group {
    display: grid;
    grid-template-columns: minmax(0, 240px) minmax(0, 1fr);
    gap: 16px 36px;
    padding: 22px 0;
    border-top: 1px solid var(--rule);
  }

  @media (max-width: 860px) {
    .group {
      grid-template-columns: minmax(0, 1fr);
    }
  }

  .g-name {
    display: grid;
    gap: 6px;
    align-content: start;
  }

  .g-name h3 {
    display: flex;
    align-items: center;
    gap: 10px;
    font: 600 16px var(--font-body);
  }

  .g-name h3::before {
    content: "";
    width: 12px;
    height: 12px;
    border-radius: 3px;
    background: var(--zfill);
    border: 1px solid var(--zb);
    flex: none;
  }

  .g-name p {
    margin: 0;
    font-size: 13px;
    color: var(--muted);
  }

  .items {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 12px;
  }

  .item {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 12px;
    padding: 14px 16px;
    display: grid;
    gap: 6px;
    align-content: start;
    min-width: 0;
  }

  .item h4 {
    font: 600 14px/1.3 var(--font-mono);
    overflow-wrap: anywhere;
  }

  .item .path {
    font: 400 11.5px/1.45 var(--font-mono);
    color: var(--zt);
    overflow-wrap: anywhere;
  }

  .item p {
    margin: 0;
    font-size: 13.5px;
    line-height: 1.5;
  }

  footer {
    padding-block: 28px 48px;
    color: var(--muted);
    font-size: 13px;
    border-top: 1px solid var(--rule);
    margin-top: 16px;
  }

  .load-note {
    padding-top: 48px;
  }

  @media print {
    .toggles, .chips, .show-btn {
      display: none !important;
    }

    .map-scroll {
      overflow: visible;
    }

    .map-svg {
      min-width: 0;
    }

    .flow-card, .item, .group, .rules li {
      break-inside: avoid;
    }
  }
</style>
</head>
<body>

<header class="hero wrap">
  <div class="topbar">
    <span class="mark">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="2" y="3" width="20" height="18" rx="4" fill="none" stroke="var(--accent)" stroke-width="2"/>
        <path d="M2 9h20M9 9v12" stroke="var(--accent)" stroke-width="2"/>

    </span>
    <div class="toggles">

      </div>

  <p class="eyebrow" data-i18n="eyebrow"></p>

<section class="map-sec wide" id="map">
  <div class="map-top">
    <div class="sec-head">
      <div class="seg tabs" role="group" id="map-tabs">
        <button type="button" data-tab="mvc" aria-pressed="true" data-i18n="tabMvc"></button>

<section class="sec wrap" id="why">

<section class="sec wrap" id="flows">
  <div class="sec-head">
    <h2 data-i18n="flowsTitle"></h2>

    <div class="col">
      <div class="col-head"><h3 data-i18n="colData"></h3><span data-i18n="colDataSub"></span></div>
      <div class="col" id="flows-data"></div>
    </div>
    <div class="col">
      <div class="col-head"><h3 data-i18n="colEnv"></h3><span data-i18n="colEnvSub"></span></div>
      <div class="col" id="flows-env"></div>
    </div>
  </div>
</section>

<section class="sec wrap" id="update">
  <div class="sec-head">
    <h2 data-i18n="updTitle"></h2>
    <p data-i18n="updLede"></p>
  </div>
  <div class="phases" id="phases" role="group"></div>
  <div class="ph-detail" id="ph-detail" aria-live="polite"></div>
</section>

<section class="sec wrap" id="rules">
  <div class="sec-head">
    <h2 data-i18n="rulesTitle"></h2>
    <p data-i18n="rulesLede"></p>
  </div>
  <ol class="rules" id="rules-list"></ol>
</section>

<section class="sec wrap" id="dom">
  <div class="sec-head">
    <h2 data-i18n="domTitle"></h2>

    <ul class="tree" id="dom-tree"></ul>
    <div class="tside" id="dom-side"></div>
  </div>
</section>

<section class="sec wrap" id="blocks">
  <div class="sec-head">
    <h2 data-i18n="blocksTitle"></h2>
    <p data-i18n="blocksLede"></p>
  </div>
  <div id="groups"></div>

<footer class="wrap"><span data-i18n="footer"></span></footer>

<script>
(function () {
  'use strict';

  // Texts of the page come from architecture/<lang>.json: ?lang= picks the language, English is the default and the fallback
  const params = new URLSearchParams(location.search);
  const requested = /^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$/.test(params.get('lang') || '') ? params.get('lang') : 'en';

  const load = code => fetch(`architecture/${code}.json`).then(response => {
    if (!response.ok) {
      throw new Error(`architecture/${code}.json: HTTP ${response.status}`);
    }

    return response.json().then(text => ({code, text}));
  });

  ((requested === 'en') ? load('en') : load(requested).catch(() => load('en'))).then(({code, text}) => start(code, text), () => {
    // A page opened from the file system cannot fetch its texts
    const note = document.createElement('p');
    note.className = 'lede wrap load-note';
    note.textContent = 'The texts of this page are loaded from architecture/en.json, which a browser does not allow for a page opened from the file system. Serve the docs folder over HTTP, for example with npx http-server docs, and open architecture.html from there.';
    document.body.replaceChildren(note);
  });

  function start(lang, TEXT) {
    const T = key => key.split('.').reduce((o, k) => (o === undefined || o === null) ? o : o[k], TEXT);


    /* ---------- copy ---------- */
    const UI = {
      title: T('ui.title'),
      themeAuto: T('ui.themeAuto'),
      themeLight: T('ui.themeLight'),
      themeDark: T('ui.themeDark'),
      eyebrow: T('ui.eyebrow'),
      h1: T('ui.h1'),
      lede: T('ui.lede'),
      tabMvc: T('ui.tabMvc'),
      tabPkg: T('ui.tabPkg'),
      mvcTitle: T('ui.mvcTitle'),
      mvcLede: T('ui.mvcLede'),
      mvcAria: T('ui.mvcAria'),
      mvcCaption: T('ui.mvcCaption'),
      forbidBtn: T('ui.forbidBtn'),
      forbidHead: T('ui.forbidHead'),
      forbidLede: T('ui.forbidLede'),
      contract: T('ui.contract'),
      ctxNoMethods: T('ui.ctxNoMethods'),
      islandNoCtx: T('ui.islandNoCtx'),
      lgCtrl: T('ui.lgCtrl'),
      lgModel: T('ui.lgModel'),
      lgViewLane: T('ui.lgViewLane'),
      lgHost: T('ui.lgHost'),
      lgPkgColor: T('ui.lgPkgColor'),
      lgForbid: T('ui.lgForbid'),
      whyTitle: T('ui.whyTitle'),
      whyLede: T('ui.whyLede'),
      cmpTitle: T('ui.cmpTitle'),
      cmpAspect: T('ui.cmpAspect'),
      cmpClassic: T('ui.cmpClassic'),
      mapTitle: T('ui.mapTitle'),
      mapLede: T('ui.mapLede'),
      all: T('ui.all'),
      hint: T('ui.hint'),
      caption: T('ui.caption'),
      lgApp: T('ui.lgApp'),
      lgWrap: T('ui.lgWrap'),
      lgCore: T('ui.lgCore'),
      lgSkin: T('ui.lgSkin'),
      lgMod: T('ui.lgMod'),
      lgState: T('ui.lgState'),
      lgView: T('ui.lgView'),
      lgCall: T('ui.lgCall'),
      lgEvent: T('ui.lgEvent'),
      lgActive: T('ui.lgActive'),
      lgBadge: T('ui.lgBadge'),
      flowsTitle: T('ui.flowsTitle'),
      flowsLede: T('ui.flowsLede'),
      colData: T('ui.colData'),
      colDataSub: T('ui.colDataSub'),
      colEnv: T('ui.colEnv'),
      colEnvSub: T('ui.colEnvSub'),
      showOnMap: T('ui.showOnMap'),
      updTitle: T('ui.updTitle'),
      updLede: T('ui.updLede'),
      rulesTitle: T('ui.rulesTitle'),
      rulesLede: T('ui.rulesLede'),
      domTitle: T('ui.domTitle'),
      domLede: T('ui.domLede'),
      blocksTitle: T('ui.blocksTitle'),
      blocksLede: T('ui.blocksLede'),
      footer: T('ui.footer'),
      mapAria: T('ui.mapAria'),
      whereLbl: T('ui.whereLbl'),
      doesLbl: T('ui.doesLbl'),
      mayLbl: T('ui.mayLbl'),
      mayNotLbl: T('ui.mayNotLbl'),
      codeLbl: T('ui.codeLbl')
    };

    const FACTS = [
      {v: '0', l: T('facts.0.l')},
      {v: '6', l: T('facts.1.l')},
      {v: '3', l: T('facts.2.l')},
      {v: '1', l: T('facts.3.l')},
      {v: '10', l: T('facts.4.l')}
    ];

    /* ---------- map model ---------- */
    const ZONES = [
      {cls: 'z-app', x: 16, y: 40, w: 196, h: 810, t: T('zones.app.t')},
      {cls: 'z-wrap', x: 226, y: 40, w: 206, h: 810, t: T('zones.wrap.t')},
      {cls: 'z-core', x: 446, y: 40, w: 650, h: 750, t: T('zones.core.t')},
      {cls: 'z-skin', x: 1110, y: 40, w: 310, h: 610, t: T('zones.skin.t')},
      {cls: 'z-mod', x: 1110, y: 670, w: 310, h: 180, t: T('zones.mod.t')}
    ];

    /* ---------- geometry ---------- */
    function geometry() {
      const nodes = {};
      const edges = [];

      if (mapTab === 'pkg') {
        Object.keys(NODES).forEach(id => {
          if (!NODES[id].mvcOnly) {
            nodes[id] = NODES[id];
          }
        });
        EDGES.forEach(e => edges.push(e));

        return {W: 1440, H: 866, zones: ZONES, notes: [], nodes, edges, alias: {}};
      }

      Object.keys(MVC.pos).forEach(id => {
        const [x, y, w, h, parent] = MVC.pos[id];
        nodes[id] = Object.assign({}, NODES[id], {x, y, w, h}, parent ? {parent} : {});
      });

      EDGES.forEach(e => {
        const m = MVC.edges[e.id];

        if (m) {
          edges.push(Object.assign({}, e, {pts: m.pts, lp: m.lp, l: m.l || e.l}));
        }
      });

      MVC.extra.forEach(e => edges.push(e));

      return {W: MVC.W, H: MVC.H, zones: MVC.zones, notes: MVC.notes, nodes, edges, alias: MVC.alias};
    }

    let geo = null;

    /* ---------- svg ---------- */
    function rpath(pts, r) {
      let d = `M${pts[0][0]},${pts[0][1]}`;

      for (let i = 1; i < pts.length - 1; i++) {
        const [px, py] = pts[i - 1];
        const [x, y] = pts[i];
        const [nx, ny] = pts[i + 1];
        const l1 = Math.hypot(x - px, y - py);
        const l2 = Math.hypot(nx - x, ny - y);
        const rr = Math.min(r, l1 / 2, l2 / 2);
        const ax = x - (x - px) / l1 * rr;
        const ay = y - (y - py) / l1 * rr;
        const bx = x + (nx - x) / l2 * rr;
        const by = y + (ny - y) / l2 * rr;

        d += ` L${ax},${ay} Q${x},${y} ${bx},${by}`;
      }

      const last = pts[pts.length - 1];

      return d + ` L${last[0]},${last[1]}`;
    }

    function labelPoint(e) {
      if (e.lp) {
        return e.lp;
      }

      let best = 0;
      let point = e.pts[0];

      for (let i = 1; i < e.pts.length; i++) {
        const [ax, ay] = e.pts[i - 1];
        const [bx, by] = e.pts[i];
        const len = Math.hypot(bx - ax, by - ay);

        if (len > best) {
          best = len;
          point = [(ax + bx) / 2, (ay + by) / 2];
        }
      }

      return point;
    }

    function nodeSVG(id) {
      const n = geo.nodes[id];
      const cls = ['node', n.z, n.k || '', n.container ? 'container' : '', n.actor ? 'actor' : ''].join(' ');
      let out = `<g class="${cls}" data-id="${id}" tabindex="0">`;

      if (n.actor) {
        out += `<rect class="n-box" x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="${n.h / 2}"/>`;
        out += `<text class="n-t" x="${n.x + n.w / 2}" y="${n.y + n.h / 2 + 4.5}" text-anchor="middle">${esc(L(n.t))}</text>`;
      } else if (n.container) {
        out += `<rect class="n-box" x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="12"/>`;
        out += `<text class="n-t" x="${n.x + 14}" y="${n.y + 23}">${esc(L(n.t))}</text>`;

        if (n.c) {
          out += `<text class="n-c" x="${n.x + n.w - 14}" y="${n.y + 23}" text-anchor="end">${esc(L(n.c))}</text>`;
        }
      } else {
        const small = n.h < 52;

        out += `<rect class="n-box" x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="8"/>`;
        out += `<text class="n-t" x="${n.x + 12}" y="${n.y + (small ? 20 : 23)}">${esc(L(n.t))}</text>`;

        if (n.s) {
          out += `<text class="n-s" x="${n.x + 12}" y="${n.y + (small ? 37 : 41)}">${esc(L(n.s))}</text>`;
        }
      }

      return out + '</g>';
    }

    function edgeSVG(e) {
      const d = rpath(e.pts, 7);

      return `<g class="edge${e.dashed ? ' dashed' : ''}" data-id="${e.id}"><path class="e-line" d="${d}"/><path class="e-run" d="${d}"/></g>`;
    }

    function labelSVG(e, cls) {
      if (!e.l) {
        return '';
      }

      const [x, y] = labelPoint(e);
      const attr = cls ? `class="${cls}"` : `class="lbl" data-edge="${e.id}"`;

      return `<g ${attr}><rect x="${x}" y="${y - 9}" width="0" height="18" rx="5"/><text x="${x}" y="${y + 3.5}" text-anchor="middle">${esc(L(e.l))}</text></g>`;
    }

    function forbidSVG() {
      if (mapTab !== 'mvc') {
        return '';
      }

      let out = '<g class="fb">';

      MVC.forbid.arrows.forEach(a => {
        out += `<path class="fb-line" d="${rpath(a.pts, 6)}"/>`;
        out += labelSVG(a, 'fb-lbl');
      });

      MVC.forbid.marks.forEach(m => {
        const n = geo.nodes[m.node];
        const text = L(m.l);
        const w = 14 + text.length * 6.3;
        const x = (m.side === 'left') ? n.x + 6 : n.x + n.w - w - 6;
        const y = (m.side === 'top') ? n.y - 9 : n.y + n.h - 9;

        out += `<g class="fb-mark"><rect x="${x}" y="${y}" width="${w}" height="18" rx="9"/><text x="${x + w / 2}" y="${y + 12.5}" text-anchor="middle">${esc(text)}</text></g>`;
      });

      return out + '</g>';
    }

    function svgMap() {
      let out = `<svg class="map-svg${forbidOn && mapTab === 'mvc' ? ' forbidding' : ''}" id="map-svg" viewBox="0 0 ${geo.W} ${geo.H}" role="img" aria-label="${esc(L(mapTab === 'mvc' ? UI.mvcAria : UI.mapAria))}">`;

      out += '<defs>';
      out += '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>';
      out += '<marker id="ah-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-on" d="M0,0 L10,5 L0,10 z"/></marker>';
      out += '<marker id="ah-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ah-hl" d="M0,0 L10,5 L0,10 z"/></marker>';
      out += '<marker id="ah-fb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="ah-fb" d="M0,0 L10,5 L0,10 z"/></marker>';
      out += '</defs>';

      geo.zones.forEach(z => {
        out += `<g class="zone ${z.cls}${z.big ? ' big' : ''}"><rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" rx="14"/><text x="${z.x + 14}" y="${z.y + (z.big ? 24 : 20)}">${esc(L(z.t))}</text></g>`;
      });

      geo.notes.forEach(n => {
        out += `<text class="lane-note" x="${n.x}" y="${n.y}">`;
        L(n.lines).forEach((line, i) => out += `<tspan x="${n.x}" dy="${i ? 16 : 0}">${esc(line)}</tspan>`);
        out += '</text>';
      });

      // Containers first, so their children and the edges are drawn over them
      const ids = Object.keys(geo.nodes);

      ids.filter(id => geo.nodes[id].container).forEach(id => out += nodeSVG(id));
      geo.edges.forEach(e => out += edgeSVG(e));
      ids.filter(id => !geo.nodes[id].container).forEach(id => out += nodeSVG(id));
      geo.edges.forEach(e => out += labelSVG(e));
      out += forbidSVG();
      out += '<g id="badges"></g>';

      return out + '</svg>';
    }

    function sizeLabels(svg) {
      svg.querySelectorAll('.lbl, .fb-lbl').forEach(g => {
        const text = g.querySelector('text');
        const rect = g.querySelector('rect');
        let width = 0;

        try {
          width = text.getBBox().width;
        } catch (e) {
          width = 0;
        }

        if (!width) {
          width = text.textContent.length * 6.4;
        }

        const x = Number(text.getAttribute('x'));

        rect.setAttribute('x', String(x - width / 2 - 6));
        rect.setAttribute('width', String(width + 12));
      });
    }

    function fitTexts(svg) {
      // A text wider than its block ends with an ellipsis; the full text stays in the tooltip
      svg.querySelectorAll('.node').forEach(g => {
        const n = geo.nodes[g.getAttribute('data-id')];
        const room = n.w - 24;

        g.querySelectorAll('.n-t, .n-s').forEach(text => {
          let length = 0;

          try {
            length = text.getComputedTextLength();
          } catch (e) {
            return;
          }

          if (!length || length <= room) {
            return;
          }

          const full = text.textContent;
          let cut = full;

          while (cut.length > 1 && text.getComputedTextLength() > room) {
            cut = cut.slice(0, -1);
            text.textContent = cut.trimEnd() + '…';
          }

          const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');

          title.textContent = full;
          text.appendChild(title);
        });
      });
    }

    /** The links of a flow on the current map: the layers map draws some of them as the loop through the DOM. */
    function flowEdges(f) {
      const present = new Set(geo.edges.map(e => e.id));
      const ids = [];

      f.edges.forEach(id => (geo.alias[id] || [id]).forEach(a => {
        if (present.has(a) && !ids.includes(a)) {
          ids.push(a);
        }
      }));

      return ids;
    }

    function badgesSVG(f) {
      const nums = {};

      f.steps.forEach(([id], i) => {
        if (geo.nodes[id]) {
          (nums[id] = nums[id] || []).push(i + 1);
        }
      });

      let out = '';

      Object.keys(nums).forEach(id => {
        const n = geo.nodes[id];
        const label = nums[id].join('·');
        const w = Math.max(20, 8 + label.length * 6.6);
        const cx = n.x + n.w - 4;
        const cy = n.y;

        out += `<g class="badge"><rect x="${cx - w / 2}" y="${cy - 10}" width="${w}" height="20" rx="10"/><text x="${cx}" y="${cy + 4}" text-anchor="middle">${label}</text></g>`;
      });

      return out;
    }

    function flowNodes(f) {
      const set = new Set(f.steps.map(([id]) => id).filter(id => geo.nodes[id]));

      flowEdges(f).forEach(id => {
        const e = geo.edges.find(x => x.id === id);
        set.add(e.from);
        set.add(e.to);
      });

      return set;
    }

    function markHolders(svg, set) {
      // A container stays visible when one of its children is lit
      Object.keys(geo.nodes).forEach(id => {
        const parent = geo.nodes[id].parent;

        if (parent && set.has(id)) {
          svg.querySelector(`.node[data-id="${parent}"]`).classList.add('holder');
        }
      });
    }

    function applyFlow() {
      const svg = document.getElementById('map-svg');

      if (!svg) {
        return;
      }

      svg.classList.remove('hovering');
      svg.querySelectorAll('.on, .hl, .holder').forEach(el => el.classList.remove('on', 'hl', 'holder'));

      const badges = svg.querySelector('#badges');
      const f = flowById(flowId);

      if (!f) {
        svg.classList.remove('flowing');
        badges.innerHTML = '';
        return;
      }

      svg.classList.add('flowing');

      const nodes = flowNodes(f);

      nodes.forEach(id => svg.querySelector(`.node[data-id="${id}"]`).classList.add('on'));
      markHolders(svg, nodes);
      flowEdges(f).forEach(id => {
        svg.querySelector(`.edge[data-id="${id}"]`).classList.add('on');
        const lbl = svg.querySelector(`.lbl[data-edge="${id}"]`);

        if (lbl) {
          lbl.classList.add('on');
        }
      });

      badges.innerHTML = badgesSVG(f);
    }

    function hover(id) {
      const svg = document.getElementById('map-svg');

      if (flowId || !svg) {
        return;
      }

      svg.querySelectorAll('.hl, .holder').forEach(el => el.classList.remove('hl', 'holder'));

      if (!id) {
        svg.classList.remove('hovering');
        return;
      }

      svg.classList.add('hovering');

      const children = Object.keys(geo.nodes).filter(k => geo.nodes[k].parent === id);
      const own = new Set([id].concat(children));
      const lit = new Set(own);

      geo.edges.forEach(e => {
        if (own.has(e.from) || own.has(e.to)) {
          lit.add(e.from);
          lit.add(e.to);
          svg.querySelector(`.edge[data-id="${e.id}"]`).classList.add('hl');
          const lbl = svg.querySelector(`.lbl[data-edge="${e.id}"]`);

          if (lbl) {
            lbl.classList.add('hl');
          }
        }
      });

      lit.forEach(k => svg.querySelector(`.node[data-id="${k}"]`).classList.add('hl'));
      markHolders(svg, lit);
    }

    function bindHover() {
      const svg = document.getElementById('map-svg');

      svg.querySelectorAll('.node').forEach(g => {
        const id = g.getAttribute('data-id');

        g.addEventListener('pointerenter', () => hover(id));
        g.addEventListener('pointerleave', () => hover(geo.nodes[id].parent || null));
        g.addEventListener('focus', () => hover(id));
        g.addEventListener('blur', () => hover(null));
      });
    }

    function renderMap() {
      geo = geometry();

      const wrap = document.getElementById('map-wrap');

      wrap.innerHTML = svgMap();
      sizeLabels(wrap.querySelector('svg'));
      fitTexts(wrap.querySelector('svg'));
      bindHover();

      document.querySelectorAll('#map-tabs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tab === mapTab)));
      document.getElementById('map-title').textContent = L(mapTab === 'mvc' ? UI.mvcTitle : UI.mapTitle);
      document.getElementById('map-lede').textContent = L(mapTab === 'mvc' ? UI.mvcLede : UI.mapLede);

      const fb = document.getElementById('forbid-btn');

      fb.hidden = mapTab !== 'mvc';
      fb.setAttribute('aria-pressed', String(forbidOn));
      fb.textContent = L(UI.forbidBtn);

      document.getElementById('legend').innerHTML = legendHTML();
      renderPanel();
      applyFlow();
    }

    /* ---------- html parts ---------- */
    function chipsHTML() {
      let out = `<button type="button" class="chip all" data-flow="" aria-pressed="${!flowId}">${esc(L(UI.all))}</button>`;

      FLOWS.forEach((f, i) => {
        out += `<button type="button" class="chip" data-flow="${f.id}" aria-pressed="${flowId === f.id}"><span class="cn">${i + 1}</span>${esc(L(f.t))}</button>`;
      });

      return out;
    }

    function legendHTML() {
      const sw = (cls, key) => `<li><span class="sw ${cls}"></span>${esc(L(UI[key]))}</li>`;
      const line = (dashed, cls, key) => `<li><svg viewBox="0 0 30 14" aria-hidden="true"><path d="M1 7H25" stroke="var(${cls})" stroke-width="${cls === '--accent' ? 2.3 : 1.4}" ${dashed ? 'stroke-dasharray="5 4"' : ''} fill="none"/><path d="M24 3 L29 7 L24 11 z" fill="var(${cls})"/></svg>${esc(L(UI[key]))}</li>`;

      const lines = line(false, '--line', 'lgCall') + line(true, '--line', 'lgEvent') + line(false, '--accent', 'lgActive')
        + `<li><span class="bd">3</span>${esc(L(UI.lgBadge))}</li>`;

      if (mapTab === 'mvc') {
        return sw('z-ctrl', 'lgCtrl') + sw('z-model', 'lgModel') + sw('z-view', 'lgViewLane') + sw('z-host', 'lgHost')
          + sw('kind z-skin', 'lgPkgColor') + lines
          + `<li><svg viewBox="0 0 30 14" aria-hidden="true"><path d="M1 7H25" stroke="var(--danger)" stroke-width="1.8" stroke-dasharray="3 4" fill="none"/><path d="M24 3 L29 7 L24 11 z" fill="var(--danger)"/></svg>${esc(L(UI.lgForbid))}</li>`;
      }

      return sw('z-app', 'lgApp') + sw('z-wrap', 'lgWrap') + sw('z-core', 'lgCore') + sw('z-skin', 'lgSkin') + sw('z-mod', 'lgMod')
        + sw('kind k-state', 'lgState') + sw('kind k-view', 'lgView') + lines;
    }

    function renderPanel() {
      const f = flowById(flowId);
      const panel = document.getElementById('panel');

      if (!f && forbidOn && mapTab === 'mvc') {
        const items = [];

        MVC.forbid.arrows.concat(MVC.forbid.marks).forEach(x => {
          if (x.rule && !items.some(i => i.rule === x.rule)) {
            items.push({rule: x.rule, t: L(RULES[x.rule - 1].t) + ': ' + L(RULES[x.rule - 1].d)});
          }
        });
        items.sort((a, b) => a.rule - b.rule);
        items.push({rule: 0, t: L(UI.ctxNoMethods)}, {rule: 0, t: L(UI.islandNoCtx)});

        panel.innerHTML = `<div class="panel-head"><b>${esc(L(UI.forbidHead))}</b></div><p class="hint" style="margin-bottom:10px">${esc(L(UI.forbidLede))}</p><ul class="fb-list">`
          + items.map(i => `<li><span class="rn">${i.rule || '✕'}</span><span>${esc(i.t)}${i.rule ? '' : ` <span class="trig">(${esc(L(UI.contract))})</span>`}</span></li>`).join('')
          + '</ul>';
        return;
      }

      if (!f) {
        panel.innerHTML = `<p class="hint">${esc(L(UI.hint))}</p><p class="cap">${esc(L(mapTab === 'mvc' ? UI.mvcCaption : UI.caption))}</p>`;
        return;
      }

      let out = `<div class="panel-head"><b>${esc(L(f.t))}</b><span class="trig">${esc(L(f.trig))}</span></div><ol class="psteps">`;

      f.steps.forEach(([, text]) => out += `<li><span>${fmt(L(text))}</span></li>`);
      out += '</ol>';

      if (f.note) {
        out += `<p class="note" style="margin-top:10px">${fmt(L(f.note))}</p>`;
      }

      panel.innerHTML = out;
    }

    function cardHTML(f, i) {
      let out = `<article class="flow-card" id="flow-${f.id}"><div class="fc-head"><span class="ring">${i + 1}</span><div><h4>${esc(L(f.t))}</h4><div class="trig">${esc(L(f.trig))}</div></div></div><ol class="steps">`;

      f.steps.forEach(([id, text]) => {
        const n = NODES[id];
        out += `<li><p>${fmt(L(text))}</p><span class="nchip ${n.z}">${esc(L(n.t))}</span></li>`;
      });

      out += '</ol>';

      if (f.note) {
        out += `<p class="note">${fmt(L(f.note))}</p>`;
      }

      return out + `<button type="button" class="show-btn" data-flow="${f.id}">${esc(L(UI.showOnMap))}</button></article>`;
    }

    function phasesHTML() {
      return PHASES.map((p, i) => `<button type="button" class="ph ${p.cls}" data-ph="${i}" aria-pressed="${i === phaseIdx}"><span class="pn">${p.n}</span><b>${esc(p.t)}</b><span>${esc(L(p.s))}</span></button>`).join('');
    }

    function phaseDetailHTML() {
      const p = PHASES[phaseIdx];

      return `<div><h3>${esc(p.t)}</h3><p>${fmt(L(p.d))}</p></div>`
        + `<dl class="kv"><dt>${esc(L(UI.mayLbl))}</dt><dd>${fmt(L(p.may))}</dd><dt>${esc(L(UI.mayNotLbl))}</dt><dd>${fmt(L(p.not))}</dd><dt>${esc(L(UI.codeLbl))}</dt><dd><code>${esc(p.code)}</code></dd></dl>`;
    }

    function rulesHTML() {
      return RULES.map((r, i) => `<li><span class="rn">${i + 1}</span><div><b>${esc(L(r.t))}</b><p>${esc(L(r.d))}</p></div></li>`).join('');
    }

    function treeHTML() {
      return TREE.map(([d, name, kind, note]) => {
        const k = kind ? `<span class="kind ${kind}">${kind}</span>` : '';
        const n = note ? `<span class="tnote">${esc(L(note))}</span>` : '';

        return `<li class="${d ? 'sub' : ''}" style="--d:${d}"><span class="sn">${esc(L(name))}</span>${k}${n}</li>`;
      }).join('');
    }

    function treeSideHTML() {
      return TREE_SIDE.map(s => `<div><h4>${esc(s.h)}</h4><p>${fmt(L(s.p))}</p></div>`).join('');
    }

    function groupsHTML() {
      return GROUPS.map(g => {
        const items = g.items.map(([t, p, d]) => `<div class="item ${g.z}"><h4>${esc(L(t))}</h4><div class="path">${esc(p)}</div><p>${esc(L(d))}</p></div>`).join('');

        return `<div class="group ${g.z}"><div class="g-name"><h3>${esc(L(g.t))}</h3><p>${esc(L(g.s))}</p></div><div class="items">${items}</div></div>`;
      }).join('');
    }

    function whyHTML() {
      return WHY.map(w => `<article class="why-card"><span class="wm">${esc(w.m)}</span><h3>${esc(L(w.t))}</h3><p>${fmt(L(w.d))}</p><div class="wr">→ <b>${esc(L(w.r))}</b></div></article>`).join('');
    }

    function cmpHTML() {
      return `<thead><tr><th>${esc(L(UI.cmpAspect))}</th><th>${esc(L(UI.cmpClassic))}</th><th>Table, Bro</th></tr></thead><tbody>`
        + CMP.map(([a, b, c]) => `<tr><td>${esc(L(a))}</td><td>${esc(L(b))}</td><td>${esc(L(c))}</td></tr>`).join('')
        + '</tbody>';
    }

    function factsHTML() {
      return FACTS.map(f => `<div class="fact"><span class="fv">${esc(f.v)}</span><span class="fl">${esc(L(f.l))}</span></div>`).join('');
    }

    /* ---------- render ---------- */
    function render() {
      document.documentElement.lang = lang;
      document.title = L(UI.title);

      document.querySelectorAll('[data-i18n]').forEach(el => {
        el.innerHTML = fmt(L(UI[el.getAttribute('data-i18n')]));
      });

      document.getElementById('facts').innerHTML = factsHTML();
      document.getElementById('chips').innerHTML = chipsHTML();
      document.getElementById('why-grid').innerHTML = whyHTML();
      document.getElementById('cmp').innerHTML = cmpHTML();

      document.getElementById('flows-data').innerHTML = FLOWS.map((f, i) => f.col === 'data' ? cardHTML(f, i) : '').join('');
      document.getElementById('flows-env').innerHTML = FLOWS.map((f, i) => f.col === 'env' ? cardHTML(f, i) : '').join('');
      document.getElementById('phases').innerHTML = phasesHTML();
      document.getElementById('ph-detail').innerHTML = phaseDetailHTML();
      document.getElementById('rules-list').innerHTML = rulesHTML();
      document.getElementById('dom-tree').innerHTML = treeHTML();
      document.getElementById('dom-side').innerHTML = treeSideHTML();
      document.getElementById('groups').innerHTML = groupsHTML();

      renderMap();
    }

    function selectFlow(id) {
      flowId = id || null;
      document.querySelectorAll('#chips .chip').forEach(b => b.setAttribute('aria-pressed', String((b.dataset.flow || null) === flowId)));

      // A flow and the forbidden links do not share the map
      if (flowId && forbidOn) {
        forbidOn = false;
        renderMap();
        return;
      }

      renderPanel();
      applyFlow();
    }

    document.getElementById('chips').addEventListener('click', event => {
      const chip = event.target.closest('.chip');

      if (chip) {
        selectFlow(chip.dataset.flow === flowId ? null : chip.dataset.flow);
      }
    });

    document.getElementById('map-tabs').addEventListener('click', event => {
      const btn = event.target.closest('button');

      if (btn && btn.dataset.tab !== mapTab) {
        mapTab = btn.dataset.tab;
        renderMap();
      }
    });

    document.getElementById('forbid-btn').addEventListener('click', () => {
      forbidOn = !forbidOn;

      if (forbidOn) {
        flowId = null;
        document.querySelectorAll('#chips .chip').forEach(b => b.setAttribute('aria-pressed', String(!b.dataset.flow)));
      }

      renderMap();
    });

    document.getElementById('flows').addEventListener('click', event => {
      const btn = event.target.closest('.show-btn');

      if (btn) {
        selectFlow(btn.dataset.flow);
        document.getElementById('map').scrollIntoView({behavior: 'smooth', block: 'start'});
      }
    });

    document.getElementById('phases').addEventListener('click', event => {
      const btn = event.target.closest('.ph');

      if (btn) {
        phaseIdx = Number(btn.dataset.ph);
        document.querySelectorAll('#phases .ph').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.ph) === phaseIdx)));
        document.getElementById('ph-detail').innerHTML = phaseDetailHTML();
      }
    });

    document.getElementById('theme-seg').addEventListener('click', event => {
      const btn = event.target.closest('button');

      if (!btn) {
        return;
      }

      const theme = btn.dataset.theme;

      if (theme === 'auto') {
        document.documentElement.removeAttribute('data-theme');
      } else {
        document.documentElement.setAttribute('data-theme', theme);
      }

      document.querySelectorAll('#theme-seg button').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && flowId) {
        selectFlow(null);
      }
    });

    if (params.get('theme') === 'light' || params.get('theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', params.get('theme'));
      document.querySelectorAll('#theme-seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.theme === params.get('theme'))));
    }

    if (params.get('tab') === 'pkg' || params.get('tab') === 'mvc') {
      mapTab = params.get('tab');
    }

    if (params.get('forbid') === '1') {
      forbidOn = true;
    }

    if (flowById(params.get('flow'))) {
      flowId = params.get('flow');
    }

    render();
  }
})();
</script>
</body>
</html>
